[project]
name = "computerpilot-mcp"
version = "0.3.0"
description = "Cross-platform MCP server for computer use, developer automation, durable jobs, recovery, and secure remote access."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "computer-use", "desktop-automation", "developer-tools", "ai-agents", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=2.0,<2.1",
    "pydantic>=2.12,<3",
    "psutil>=7.0,<8",
    "charset-normalizer>=3.4,<4",
    "Pillow>=11,<13",
]

[project.urls]
Homepage = "https://github.com/dibbed/computerpilot-mcp"
Repository = "https://github.com/dibbed/computerpilot-mcp"
Issues = "https://github.com/dibbed/computerpilot-mcp/issues"
Changelog = "https://github.com/dibbed/computerpilot-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
windows = ["uiautomation>=2.0.29,<3"]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
cache_dir = ".pytest_cache"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [".venv", ".agent_state", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = "(^|/)(.venv|.agent_state|graphify-out|output)/"
