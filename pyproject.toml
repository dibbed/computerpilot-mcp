[project]
name = "windows-agent-mcp"
version = "0.2.7"
description = "High-performance local developer-agent MCP with durable jobs and Secure Tunnel support."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0,<2.1",
    "pydantic>=2.12,<3",
    "psutil>=7.0,<8",
    "charset-normalizer>=3.4,<4",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
windows = ["uiautomation>=2.0.29,<3"]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
cache_dir = ".pytest_cache"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [".venv", ".agent_state", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = "(^|/)(.venv|.agent_state|graphify-out|output)/"
