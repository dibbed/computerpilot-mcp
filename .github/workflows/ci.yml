name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Test & Validate (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify compilation and syntax
        run: python -m compileall -q core tools scripts tests

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Type check with Mypy
        run: python -m mypy core tools scripts tests

      - name: Verify MCP startup check
        run: python main.py --check

      - name: Verify MCP health check
        run: python -m scripts.health_check --json

      - name: Run test suite with Pytest
        run: python -m pytest
