name: Publish Release

on:
  workflow_run:
    workflows: ["Platform Release Validation"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Detect release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s "$SHA")"
          if [[ "$subject" =~ ^release:\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify same-SHA validation workflows
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wait_for_workflow() {
            workflow="$1"
            for attempt in $(seq 1 90); do
              json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SHA&event=push&per_page=10")"
              status="$(jq -r '.workflow_runs[0].status // "missing"' <<<"$json")"
              conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$json")"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || {
                  echo "$workflow failed for $SHA: $conclusion" >&2
                  return 1
                }
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for $workflow on $SHA" >&2
            return 1
          }
          wait_for_workflow "ci.yml"
          wait_for_workflow "release-packaging.yml"

      - name: Verify version and build artifacts
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          python -m scripts.package_release --version "$VERSION" --all --output-dir dist --json
          (cd dist && sha256sum --check SHA256SUMS.txt)
          notes="docs/V${VERSION}-RELEASE-NOTES.md"
          test -s "$notes"

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/*             --target "$SHA"             --title "$TAG - Cross-Platform Preview"             --notes-file "docs/V${VERSION}-RELEASE-NOTES.md"
