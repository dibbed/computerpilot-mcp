name: Documentation issue
description: Report inaccurate, missing, or confusing documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: "README.md, docs/installation.md, ..."
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or inaccurate?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or suggested correction
      description: For accuracy issues, point to the source, behavior, release, or command that demonstrates the mismatch.
