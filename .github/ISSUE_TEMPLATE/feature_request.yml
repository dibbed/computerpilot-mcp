name: Feature request
description: Propose a capability or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What concrete workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful capability or behavior change.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - filesystem / editing
        - code intelligence / LSP
        - Git / testing
        - terminal / process / system
        - durable jobs
        - recovery / workflows
        - browser
        - Windows desktop / UIA
        - Secure Tunnel
        - supervisor / control panel
        - packaging / release
        - documentation
        - other
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Platforms affected
      placeholder: "all / Windows / Linux / macOS / specific architecture"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention existing tools or workarounds that almost solve the problem.
